spring.application.name=backend
server.port=8080

# Database Configuration (Populated from .env / environment variables)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA & Hibernate (auto-creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration (Gmail SMTP - Credentials loaded from .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Configuration (Loaded from .env: CORS_ALLOWED_ORIGINS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
security.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS}
security.jwt.cookie-secure=${COOKIE_SECURE}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

