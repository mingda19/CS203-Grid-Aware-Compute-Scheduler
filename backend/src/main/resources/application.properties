spring.application.name=backend
server.port=${PORT:8080}

# Forecast scores (0-100 scale, matching predicted_price.confidence_score)
# below this value create an unread notification.
forecast.confidence-threshold=${FORECAST_CONFIDENCE_THRESHOLD:40}
forecast.confidence-alert.check-interval-ms=${FORECAST_CONFIDENCE_ALERT_CHECK_INTERVAL_MS:60000}
forecast.confidence-alert.lookback-minutes=${FORECAST_CONFIDENCE_ALERT_LOOKBACK_MINUTES:15}
forecast.confidence-alert.location=${FORECAST_CONFIDENCE_ALERT_LOCATION:LZ_NORTH}

# Database Configuration (Populated from .env / environment variables)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA & Hibernate (auto-creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Mail Configuration (Gmail SMTP - Credentials loaded from .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Configuration (Loaded from .env: CORS_ALLOWED_ORIGINS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
security.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS}
security.jwt.cookie-secure=${COOKIE_SECURE}
security.jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true


# Optimiser cost basis and default per-slot capacity (docs/api-contract.md section 6.4)
gacs.optimiser.cpu-kwh-per-hour=0.05
gacs.optimiser.gpu-kwh-per-hour=0.40
gacs.optimiser.default-max-cpu-hours-per-slot=256.0
gacs.optimiser.default-max-gpu-hours-per-slot=64.0
# Which model's forecast the optimizer prices against: lstm or lear.
gacs.optimiser.forecast-model=${OPTIMISER_FORECAST_MODEL:lstm}

# Natural-language constraint parser (docs/constraint-parser-plan.md): the zone operators type times in.
# Matches the frontend, which shows and reads every time in ERCOT market local time
# (frontend/src/lib/date-utils.ts, MARKET_TIMEZONE). Central Time observes DST, so this must
# stay an IANA zone id rather than a fixed offset.
gacs.parser.default-zone=America/Chicago

# Constraint classification (TypeSafe System One). No key means no classifier bean and no network
# calls at all - the rule-based parser handles everything, which is the default for dev and tests.
# The model id is pinned: question wording is tuned against one model's calibration, so a silent
# upgrade could move every probability across the guardrail thresholds with no code change.
gacs.constraintparse.jev.api-key=${TYPESAFE_API_KEY:}
gacs.constraintparse.jev.model=jev-1.14.0
gacs.constraintparse.jev.endpoint=https://api.typesafe.ai/v1/systemone
gacs.constraintparse.jev.timeout=5s
# Apply silently at or above 0.7; ask the operator between 0.3 and 0.7; drop below 0.3.
gacs.constraintparse.jev.apply-above=0.7
gacs.constraintparse.jev.review-above=0.3

# Autorun: plans each user's jobs that have no live plan. The first tick plans every such job for every user.
gacs.schedule.autorun-enabled=${GACS_SCHEDULE_AUTORUN_ENABLED:true}
gacs.schedule.autorun-ms=${GACS_SCHEDULE_AUTORUN_MS:60000}
# Two threads, so a long solve does not hold up the expiry check.
spring.task.scheduling.pool.size=2
