# Render Blueprint - defines ONLY the daily ingestion+prediction cron job.
# Deliberately does not define the existing Spring Boot web service (it was
# created by hand in the Render dashboard, not from a Blueprint) - connecting
# this file should add this one new service, not touch that one.
#
# Setup (one-time, in the Render dashboard - this file alone does not
# activate anything): New -> Blueprint -> select this repo -> Render parses
# this file and shows a preview -> it will prompt for the 3 "sync: false"
# env vars below (same values as your local .env) -> Apply.
#
# Verify the field names below against Render's current Blueprint docs when
# applying this - Render's schema has shifted over time (e.g. `env` vs
# `runtime`), and the dashboard will show a validation error before creating
# anything if something's out of date, rather than silently misconfiguring.
#
# Render documents cron schedules as UTC, so 21:00 UTC is written directly
# below - no local-timezone conversion needed (unlike the launchd plist for
# the local dev-convenience scheduler, which only understands local time).
# Confirm this in the dashboard the first time it's connected.
#
# Render Cron Jobs are a paid feature (billed by compute time per run, not
# included in any always-free tier) - check current Render pricing before
# applying this.
services:
  - type: cron
    name: gacs-daily-ingestion-prediction
    runtime: python
    schedule: "0 21 * * *"
    buildCommand: "pip install -r data_scripts/requirements.txt"
    startCommand: "bash data_scripts/render_cron.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GRIDSTATUS_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
